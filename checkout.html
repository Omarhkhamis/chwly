  <main id="main">
    <div class="wrap co-layout" data-co-main>
      <form class="co-form" data-checkout novalidate>
        <h1 class="co-title">إتمام الطلب</h1>

        <fieldset class="co-card">
          <legend><span class="co-num">1</span>بياناتك</legend>
          <div class="fld-grid">
            <div class="fld">
              <label for="f-name">الاسم الكامل</label>
              <input id="f-name" name="name" type="text" autocomplete="name" aria-describedby="err-name">
              <p class="fld-err" id="err-name" data-err="name" role="status"></p>
            </div>
            <div class="fld">
              <label for="f-phone">رقم الجوال</label>
              <div class="field field--light"><span class="field-prefix" dir="ltr">+966</span><input id="f-phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel-national" dir="ltr" placeholder="5X XXX XXXX" aria-describedby="err-phone"></div>
              <p class="fld-err" id="err-phone" data-err="phone" role="status"></p>
            </div>
            <div class="fld fld--wide">
              <label for="f-email">الإيميل <span class="opt-tag">اختياري</span></label>
              <input id="f-email" name="email" type="email" autocomplete="email" dir="ltr" aria-describedby="err-email">
              <p class="fld-err" id="err-email" data-err="email" role="status"></p>
            </div>
          </div>
        </fieldset>

        <fieldset class="co-card">
          <legend><span class="co-num">2</span>عنوان التوصيل</legend>
          <div class="fld-grid">
            <div class="fld">
              <label for="f-city">المدينة</label>
              <select id="f-city" name="city" autocomplete="address-level2" data-city aria-describedby="err-city"></select>
              <p class="fld-err" id="err-city" data-err="city" role="status"></p>
            </div>
            <div class="fld">
              <label for="f-district">الحي</label>
              <input id="f-district" name="district" type="text" autocomplete="address-level3" aria-describedby="err-district">
              <p class="fld-err" id="err-district" data-err="district" role="status"></p>
            </div>
            <div class="fld fld--wide">
              <label for="f-street">الشارع ورقم المبنى <span class="opt-tag">اختياري</span></label>
              <input id="f-street" name="street" type="text" autocomplete="street-address" aria-describedby="err-street">
              <p class="fld-err" id="err-street" data-err="street" role="status"></p>
            </div>
            <div class="fld">
              <label for="f-shortcode">العنوان الوطني المختصر <span class="opt-tag">اختياري</span></label>
              <input id="f-shortcode" name="shortcode" type="text" dir="ltr" placeholder="RRRD2929" maxlength="9" aria-describedby="err-shortcode">
              <p class="fld-err" id="err-shortcode" data-err="shortcode" role="status"></p>
            </div>
            <div class="fld">
              <label for="f-notes">ملاحظة للمندوب <span class="opt-tag">اختياري</span></label>
              <input id="f-notes" name="notes" type="text" placeholder="مثلاً: البوابة الجانبية" aria-describedby="err-notes">
              <p class="fld-err" id="err-notes" data-err="notes" role="status"></p>
            </div>
          </div>
        </fieldset>

        <fieldset class="co-card">
          <legend><span class="co-num">3</span>طريقة الشحن</legend>
          <div class="opts" data-ship-options></div>
        </fieldset>

        <fieldset class="co-card">
          <legend><span class="co-num">4</span>الدفع</legend>
          <div class="opts opts--pay" data-pay-options></div>
          <div class="card-panel" data-card-panel>
            <div class="ph ph--light">حقول البطاقة تظهر هنا من بوابة دفع سلة<small>Placeholder</small></div>
          </div>
        </fieldset>

        <div class="fld">
          <label class="check"><input type="checkbox" id="f-terms" name="terms" aria-describedby="err-terms"><span>أوافق على <a href="policies.html#terms">الشروط والأحكام</a> و<a href="policies.html#returns">سياسة الاسترجاع</a></span></label>
          <p class="fld-err" id="err-terms" data-err="terms" role="status"></p>
        </div>
        <button class="btn btn-primary btn-block co-submit" type="submit"><svg class="i"><use href="#i-lock"/></svg>ادفع <span data-pay-total></span></button>
        <p class="ph-note">نسخة تجريبية: ما في دفع حقيقي. الطلب ينحفظ بمتصفحك بس.</p>
      </form>
      <aside class="summary summary--co" data-summary aria-label="ملخص الطلب"></aside>
    </div>
